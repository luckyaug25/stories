<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Studio | Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
  
  <style>
    :root {
      --bg-dark: #09090b;
      --border: #27272a;
      --panel-bg: #121214;
    }

    body {
      background-color: var(--bg-dark);
      color: #e4e4e7;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    * {
      border-radius: 0 !important;
    }

    .btn-icon {
      background: #18181b;
      border: 1px solid var(--border);
      color: #a1a1aa;
      transition: all 0.2s;
    }

    .btn-icon:hover:not(:disabled) {
      border-color: #52525b;
      color: #f4f4f5;
      background: #27272a;
    }

    .btn-icon:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    #story img, #story video, #story iframe {
      width: 100%;
      height: auto;
      display: block;
      margin: 2rem auto;
      border: 1px solid var(--border);
      opacity: 0.9;
    }

    /* Improved content styling to preserve original formatting */
    .story-content {
      word-wrap: break-word;
      max-width: 100%;
      white-space: pre-wrap; /* Preserves line breaks and spaces */
      line-height: 1.5;
      color: #d4d4d8;
      font-size: 0.9rem;
      text-align: left;
    }

    .story-content p {
      margin-bottom: 1.5rem;
    }

    .mono-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #71717a;
    }

    header {
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(8px);
    }

    /* Individual Box Style for Pagination */
    .page-box {
      background: #18181b;
      border: 1px solid var(--border);
      color: #a1a1aa;
      min-width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-box:hover {
      border-color: #52525b;
      color: #f4f4f5;
      background: #27272a;
    }

    .page-box.active {
      background: #27272a;
      border-color: #71717a;
      color: #ffffff;
      font-weight: 600;
    }

    .page-jump-input {
      background: #18181b;
      border: 1px solid var(--border);
      color: #f4f4f5;
      width: 48px;
      height: 36px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: all 0.2s;
    }

    .page-jump-input:focus {
      border-color: #52525b;
      background: #27272a;
    }

    .page-jump-input::-webkit-inner-spin-button,
    .page-jump-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="flex flex-col items-center">

  <!-- NAV -->
  <header class="w-full h-12 border-b border-[#27272a] flex items-center justify-between px-6 shrink-0 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 bg-white flex items-center justify-center text-[10px] text-black font-bold">S</div>
        <span class="font-medium text-sm tracking-tight text-white">StoryStudio</span>
      </div>
      <div class="h-4 w-[1px] bg-zinc-800"></div>
      <nav class="flex gap-4">
        <a href="/" class="text-zinc-500 hover:text-zinc-200 transition-colors text-xs">Dashboard</a>
        <a href="/manage" class="text-zinc-500 hover:text-zinc-200 transition-colors text-xs">Stories</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
       <span class="mono-label hidden sm:inline">Reader Mode</span>
    </div>
  </header>

  <main class="max-w-5xl w-full px-6 py-12 sm:py-20 flex flex-col min-h-screen pb-32">
    <div id="story" class="flex flex-col">
      <div id="loading-container" class="py-20 text-center flex flex-col items-center gap-4">
        <div class="w-6 h-6 border-2 border-zinc-800 border-t-zinc-400 animate-spin"></div>
        <p class="mono-label">Initializing Reader...</p>
      </div>
    </div>
  </main>

  <!-- Pagination Controls -->
  <div id="pagination-controls" class="fixed bottom-0 left-0 w-full bg-[#09090b]/90 backdrop-blur-md border-t border-zinc-800 p-3 flex justify-center items-center z-50 hidden">
    <div class="max-w-4xl w-full flex justify-center items-center gap-2 flex-wrap">
      <button id="prev-page" class="btn-icon w-9 h-9 flex items-center justify-center">
        <i class="fa-solid fa-angle-left text-sm"></i>
      </button>

      <div id="pagination-boxes-container" class="flex items-center gap-1.5 flex-wrap justify-center"></div>

      <button id="next-page" class="btn-icon w-9 h-9 flex items-center justify-center">
        <i class="fa-solid fa-angle-right text-sm"></i>
      </button>
    </div>
  </div>

  <div id="custom-message-box" class="fixed top-14 right-4 p-4 text-white text-xs font-mono shadow-lg z-[100] transition-transform duration-300 transform translate-x-full hidden border border-zinc-800"></div>

  <script>
    function showCustomMessage(message, type = "info") {
      const messageBox = document.getElementById('custom-message-box');
      if (!messageBox) return;
      messageBox.textContent = message;
      messageBox.className = `fixed top-14 right-4 p-4 text-white text-xs font-mono shadow-lg z-[100] transition-transform duration-300 transform translate-x-0 border`;
      
      if (type === "error") {
        messageBox.classList.add('bg-rose-950', 'text-rose-200', 'border-rose-900');
      } else if (type === "success") {
        messageBox.classList.add('bg-emerald-950', 'text-emerald-200', 'border-emerald-900');
      } else {
        messageBox.classList.add('bg-zinc-900', 'text-zinc-200', 'border-zinc-700');
      }
      
      messageBox.classList.remove('hidden');
      setTimeout(() => {
        messageBox.classList.add('translate-x-full');
        messageBox.addEventListener('transitionend', () => {
          messageBox.classList.add('hidden');
        }, { once: true });
      }, 3000);
    }

    const storyId = new URLSearchParams(location.search).get('id');
    let storyPages = [];
    let currentPage = 0;
    let storyTitle = "";

    async function fetchStory() {
      const storyDiv = document.getElementById('story');
      const pagination = document.getElementById('pagination-controls');

      try {
        const response = await fetch(`/api/stories/${storyId}`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const story = await response.json();
        
        storyTitle = story.title || "Untitled Record";

        const content = story.content || "";
        const maxCharsPerPage = 20000; 
        storyPages = [];
        
        if (content.length <= maxCharsPerPage) {
          storyPages.push(content);
        } else {
          let remaining = content;
          while (remaining.length > 0) {
            if (remaining.length <= maxCharsPerPage) {
              storyPages.push(remaining);
              break;
            }
            let chunk = remaining.slice(0, maxCharsPerPage);
            let lastNewline = chunk.lastIndexOf("\n\n");
            if (lastNewline === -1) lastNewline = chunk.lastIndexOf("\n");
            
            const splitPoint = lastNewline > maxCharsPerPage * 0.7 ? lastNewline : maxCharsPerPage;
            storyPages.push(remaining.slice(0, splitPoint));
            remaining = remaining.slice(splitPoint).trimStart();
          }
        }

        if (storyPages.length === 0) storyPages.push("No content available for this record.");

        renderPage(0);
        if (storyPages.length > 1) pagination.classList.remove('hidden');
      } catch (error) {
        console.error('Failed to fetch story:', error);
        storyDiv.innerHTML = `
          <div class="py-20 text-center flex flex-col items-center gap-4">
            <p class="mono-label text-rose-900">CRITICAL_FETCH_FAILURE: UNABLE_TO_RETRIEVE_SOURCE</p>
          </div>
        `;
        showCustomMessage("Failed to load record.", "error");
      }
    }

    function renderPage(pageIndex) {
      const storyDiv = document.getElementById('story');
      const prevBtn = document.getElementById('prev-page');
      const nextBtn = document.getElementById('next-page');
      const paginationBoxesContainer = document.getElementById('pagination-boxes-container');

      storyDiv.innerHTML = `
        <div class="mb-12">
          <p class="mono-label mb-2">Source Archive</p>
          <h1 class="text-3xl sm:text-4xl font-semibold text-white tracking-tight">${storyTitle}</h1>
          <div class="h-[1px] w-12 bg-zinc-700 mt-6"></div>
        </div>
        <div class="story-content">${storyPages[pageIndex]}</div>
      `;

      const videos = storyDiv.querySelectorAll('video');
      videos.forEach(video => {
        video.setAttribute('autoplay', '');
        video.setAttribute('loop', '');
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.muted = true;
        video.play().catch(e => console.log("Autoplay blocked or failed:", e));
      });

      const totalPages = storyPages.length;
      paginationBoxesContainer.innerHTML = "";

      let elementsToShow = [];
      if (totalPages <= 8) {
        for (let i = 1; i <= totalPages; i++) elementsToShow.push(i);
      } else {
        const firstPart = [1, 2, 3, 4];
        const lastPart = [totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        elementsToShow = [...firstPart, 'search', ...lastPart];
      }

      elementsToShow.forEach(item => {
        if (item === 'search') {
          const jumpInput = document.createElement("input");
          jumpInput.type = "number";
          jumpInput.min = "1";
          jumpInput.max = totalPages;
          jumpInput.className = "page-jump-input";
          jumpInput.title = `Jump to page (1-${totalPages})`;
          jumpInput.placeholder = "...";
          
          jumpInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              const val = parseInt(jumpInput.value);
              if (val >= 1 && val <= totalPages) {
                currentPage = val - 1;
                renderPage(currentPage);
              } else {
                jumpInput.value = "";
              }
            }
          });
          
          paginationBoxesContainer.appendChild(jumpInput);
        } else {
          const box = document.createElement("div");
          const pageNum = item;
          box.className = `page-box ${pageNum === (pageIndex + 1) ? 'active' : ''}`;
          box.textContent = pageNum.toString().padStart(2, '0');
          box.onclick = () => {
            currentPage = pageNum - 1;
            renderPage(currentPage);
          };
          paginationBoxesContainer.appendChild(box);
        }
      });

      prevBtn.disabled = pageIndex === 0;
      nextBtn.disabled = pageIndex === totalPages - 1;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchStory();

      document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 0) {
          currentPage--;
          renderPage(currentPage);
        }
      });

      document.getElementById('next-page').addEventListener('click', () => {
        if (currentPage < storyPages.length - 1) {
          currentPage++;
          renderPage(currentPage);
        }
      });
    });
  </script>
</body>
</html>
